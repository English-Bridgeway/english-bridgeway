# Local PostgreSQL for development: docker compose -f server/docker-compose.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: english_bridgeway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data:
