name: Mobile app

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
    inputs:
      api_base:
        description: API the app talks to
        default: https://englishbridgeway.com/api

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE=${{ inputs.api_base || 'https://englishbridgeway.com/api' }}
      - uses: actions/upload-artifact@v4
        with:
          name: english-bridgeway-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  # Signed App Bundle for Google Play. Runs by hand (Actions → Mobile app → Run workflow)
  # once the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
  # ANDROID_KEY_PASSWORD repository secrets are set. See mobile/README.md.
  play-bundle:
    if: github.event_name == 'workflow_dispatch'
    needs: android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Write upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_* secrets first (see mobile/README.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          sed -i 's/^ *//' android/key.properties
      - run: flutter pub get
      - name: Build App Bundle
        run: >-
          flutter build appbundle --release
          --build-number=${{ github.run_number }}
          --dart-define=IN_APP_PURCHASES=false
          --dart-define=API_BASE=${{ inputs.api_base || 'https://englishbridgeway.com/api' }}
      - uses: actions/upload-artifact@v4
        with:
          name: english-bridgeway-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
