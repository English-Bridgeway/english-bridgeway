name: Mobile app

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
    inputs:
      api_base:
        description: API the app talks to
        default: https://englishbridgeway.com/api

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Phones only install an update signed with the same key as the app they have, so the APK
      # is signed with the upload key when the secrets are there (the same key as the Play build).
      - name: Sign with the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_* secrets, so this APK has a temporary key: phones can't update to it over an older APK. Add the secrets (mobile/README.md)."
            echo "APK_KEY=temporary" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          sed -i 's/^ *//' android/key.properties
          echo "APK_KEY=upload" >> "$GITHUB_ENV"
      # The build number comes from the version (1.1.0 → 10100), as in mobile-release.yml, so a
      # newer version always installs over an older one. Both are in the run summary.
      - name: Version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]*).*/\1/')
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD=$((MAJOR * 10000 + MINOR * 100 + ${PATCH:-0}))" >> "$GITHUB_ENV"
      - name: Build APK
        run: >-
          flutter build apk --release
          --build-name=$APP_VERSION --build-number=$APP_BUILD
          --dart-define=API_BASE=${{ inputs.api_base || 'https://englishbridgeway.com/api' }}
      - name: Summary
        run: |
          {
            echo "### Android APK"
            echo ""
            echo "Version **$APP_VERSION**, build number **$APP_BUILD**."
            if [ "$APK_KEY" = upload ]; then
              echo "To send it to phones: download english-bridgeway-apk below, then Admin → Mobile app → Publish a new version."
            else
              echo "⚠️ Signed with a temporary key (no ANDROID_KEYSTORE_* secrets). Don't publish it as an update: phones can't install it over their app."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: english-bridgeway-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  # Opens the release APK on an Android emulator and fails if the app does not stay running.
  smoke-test:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: english-bridgeway-apk
          path: mobile/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: mobile
          script: bash tool/smoke_test.sh apk/app-release.apk
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: mobile/build/smoke/

  # Signed App Bundle for Google Play. Runs by hand (Actions → Mobile app → Run workflow)
  # once the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
  # ANDROID_KEY_PASSWORD repository secrets are set. See mobile/README.md.
  play-bundle:
    if: github.event_name == 'workflow_dispatch'
    needs: android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Write upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_* secrets first (see mobile/README.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          sed -i 's/^ *//' android/key.properties
      - run: flutter pub get
      - name: Build App Bundle
        run: >-
          flutter build appbundle --release
          --build-number=${{ github.run_number }}
          --dart-define=IN_APP_PURCHASES=false
          --dart-define=API_BASE=${{ inputs.api_base || 'https://englishbridgeway.com/api' }}
      - uses: actions/upload-artifact@v4
        with:
          name: english-bridgeway-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
