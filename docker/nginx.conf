# Lets the voice chat's WebSocket (/api/socket.io/) through.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 5m;

  # Admin e-book uploads (PDFs up to EBOOK_MAX_MB, 100 MB by default) stream straight to the API.
  location /api/admin/ebooks/ {
    client_max_body_size 200m;
    proxy_request_buffering off;
    proxy_read_timeout 10m;
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API, admin API, the Cashfree webhook and the voice chat go to the API container.
  location /api/ {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build files can be cached for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Generated from the live content by the API.
  location = /sitemap.xml { proxy_pass http://server:4000; proxy_set_header Host $host; error_page 502 503 504 = @static; }
  location = /robots.txt  { proxy_pass http://server:4000; proxy_set_header Host $host; error_page 502 503 504 = @static; }
  location @static { try_files $uri =404; }

  # Files (images, icons) are served from here; every page goes to the API, which sends it
  # fully rendered with its title, description and structured data for search engines.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri @page;
  }

  location @page {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors on;
    # If the API is down the site still works: send the plain app and let the browser draw it.
    error_page 502 503 504 = /index.html;
  }

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain application/manifest+json;
}
